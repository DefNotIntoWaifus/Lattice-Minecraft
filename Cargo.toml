[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/lattice"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
lattice-proto = { path = "crates/lattice-proto" }
lattice-net = { path = "crates/lattice-net" }
lattice-auth = { path = "crates/lattice-auth" }
lattice-data = { path = "crates/lattice-data" }
lattice-assets = { path = "crates/lattice-assets" }
lattice-world = { path = "crates/lattice-world" }
lattice-render = { path = "crates/lattice-render" }

thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v3", "v4", "serde"] }
flate2 = "1"
crossbeam-channel = "0.5"
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "3", features = ["json"] }
rand = "0.9"
sha1 = "0.10"
sha2 = "0.10"
aes = "0.8"
cfb8 = "0.8"
rsa = { version = "0.9", features = ["getrandom", "sha2"] }
base64 = "0.22"
rayon = "1"
parking_lot = "0.12"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
